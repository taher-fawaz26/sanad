name: sanad
repository: https://github.com/trypass-ai/sanad

packages:
  - apps/**
  - packages/analytics
  - packages/api
  - packages/app_logger
  - packages/auth
  - packages/config
  - packages/core
  - packages/dependencies
  - packages/design_system
  - packages/domain
  - packages/flavors
  - packages/localization
  - packages/network
  - packages/notifications
  - packages/storage
  - packages/testing
  - packages/utilities

ide:
  intellij: true

command:
  bootstrap:
    environment:
      sdk: ">=3.11.0 <4.0.0"

  version:
    updateGitTagRefs: true
    workspaceChangelog: true

scripts:
  # ─── Analysis ───────────────────────────────────────────────────────────────
  analyze:
    run: melos exec -c 5 -- dart analyze . --fatal-infos
    description: Run dart analyzer across all packages.

  # ─── Testing ────────────────────────────────────────────────────────────────
  test:
    run: melos exec -c 6 --dir-exists=test -- flutter test --coverage --no-pub
    description: Run Flutter unit tests with coverage.

  test:dart:
    run: melos exec -c 6 --dir-exists=test -- dart test --coverage=coverage
    description: Run pure-Dart unit tests with coverage.

  # ─── Formatting ─────────────────────────────────────────────────────────────
  format:
    run: melos exec -c 6 -- dart format . --set-exit-if-changed
    description: Format Dart code (fails if files need formatting).

  format:fix:
    run: melos exec -c 6 -- dart format .
    description: Format Dart code and apply changes.

  # ─── Code Generation ────────────────────────────────────────────────────────
  generate:
    run: >
      melos exec -c 3 --dir-exists=lib --
      dart run build_runner build --delete-conflicting-outputs
    description: Run build_runner in all packages that have a lib/ dir.

  generate:watch:
    run: >
      melos exec -c 1 --dir-exists=lib --
      dart run build_runner watch --delete-conflicting-outputs
    description: Watch mode build_runner (run per package).

  # ─── Localization ───────────────────────────────────────────────────────────
  l10n:
    run: >
      melos exec -c 1
      --scope="localization" --
      flutter gen-l10n
    description: Generate localization ARB files for the localization package.

  # ─── Cleaning ───────────────────────────────────────────────────────────────
  clean:
    run: melos exec -c 6 -- flutter clean
    description: Run flutter clean across all packages.

  clean:dart:
    run: melos exec -c 6 -- dart pub cache clean
    description: Clean Dart pub cache.

  # ─── Coverage ───────────────────────────────────────────────────────────────
  coverage:
    run: |
      melos run test
      melos exec -c 1 --dir-exists=coverage -- \
        lcov --ignore-errors unused --list coverage/lcov.info
    description: Run tests and generate LCOV coverage report.

  # ─── Building ───────────────────────────────────────────────────────────────
  build:client:android:
    run: >
      melos exec -c 1 --scope="sanad_client" --
      flutter build apk --release
    description: Build sanad_client Android APK.

  build:client:ios:
    run: >
      melos exec -c 1 --scope="sanad_client" --
      flutter build ipa --release
    description: Build sanad_client iOS IPA.

  build:provider:android:
    run: >
      melos exec -c 1 --scope="sanad_provider" --
      flutter build apk --release
    description: Build sanad_provider Android APK.

  build:provider:ios:
    run: >
      melos exec -c 1 --scope="sanad_provider" --
      flutter build ipa --release
    description: Build sanad_provider iOS IPA.

  # ─── Compound Quality Gates ──────────────────────────────────────────────────
  check:
    run: |
      melos run format
      melos run analyze
      melos run test
    description: Full quality gate — format, analyze, test.

  ci:
    run: |
      melos bootstrap
      melos run check
    description: CI entry-point — bootstrap then full quality gate.
