name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ── Quality gate ───────────────────────────────────────────────────────────
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
          cache: true
      - name: Install Melos
        run: dart pub global activate melos
      - name: Bootstrap & Check
        run: |
          melos bootstrap
          melos run analyze
          melos run test

  # ── Build sanad_client Android ──────────────────────────────────────────────
  build-client-android:
    name: Build Client Android
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
          cache: true
      - name: Install Melos
        run: dart pub global activate melos
      - name: Bootstrap
        run: melos bootstrap
      - name: Build APK
        run: melos run build:client:android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: client-android-apk
          path: apps/sanad_client/build/app/outputs/flutter-apk/app-release.apk

  # ── Build sanad_provider Android ───────────────────────────────────────────
  build-provider-android:
    name: Build Provider Android
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
          cache: true
      - name: Install Melos
        run: dart pub global activate melos
      - name: Bootstrap
        run: melos bootstrap
      - name: Build APK
        run: melos run build:provider:android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: provider-android-apk
          path: apps/sanad_provider/build/app/outputs/flutter-apk/app-release.apk

  # ── Build sanad_client iOS ─────────────────────────────────────────────────
  build-client-ios:
    name: Build Client iOS
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
          cache: true
      - name: Install Melos
        run: dart pub global activate melos
      - name: Bootstrap
        run: melos bootstrap
      - name: Build IPA
        run: melos run build:client:ios
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: client-ios-ipa
          path: apps/sanad_client/build/ios/ipa/*.ipa

  # ── Build sanad_provider iOS ───────────────────────────────────────────────
  build-provider-ios:
    name: Build Provider iOS
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
          cache: true
      - name: Install Melos
        run: dart pub global activate melos
      - name: Bootstrap
        run: melos bootstrap
      - name: Build IPA
        run: melos run build:provider:ios
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: provider-ios-ipa
          path: apps/sanad_provider/build/ios/ipa/*.ipa
