name: Restore Font Awesome Pro
description: >
  Materializes the git-ignored third_party/font_awesome_flutter package (Font
  Awesome Pro, licensed) that the root pubspec dependency_overrides points at.
  Without it `flutter pub get` / `melos bootstrap` fail version solving. The
  package is fetched from a private GitHub Release asset in this same repo — the
  Pro OTF fonts are never committed to git, cached, or echoed to logs. See
  third_party/README.md for the licensing rationale and regeneration steps.

inputs:
  token:
    description: >
      GitHub token with `contents: read` on this repo, used to download the
      private release asset. Pass ${{ secrets.GITHUB_TOKEN }}.
    required: true
  release-tag:
    description: Release tag that holds the font_awesome_flutter tarball asset.
    required: false
    default: fontawesome-pro-7.3.1
  asset:
    description: Asset filename to download from the release.
    required: false
    default: font_awesome_flutter.tar.gz

runs:
  using: composite
  steps:
    - name: Restore third_party/font_awesome_flutter
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        # Idempotent: a developer/self-hosted checkout may already carry it.
        if [ -f third_party/font_awesome_flutter/pubspec.yaml ]; then
          echo "third_party/font_awesome_flutter already present — skipping fetch."
          exit 0
        fi

        echo "Fetching Font Awesome Pro package from release '${{ inputs.release-tag }}'…"
        mkdir -p third_party
        # --clobber not needed; download to a temp file outside the repo tree.
        gh release download "${{ inputs.release-tag }}" \
          --repo "$GITHUB_REPOSITORY" \
          --pattern "${{ inputs.asset }}" \
          --output "$RUNNER_TEMP/font_awesome_flutter.tar.gz"

        tar -xzf "$RUNNER_TEMP/font_awesome_flutter.tar.gz" -C third_party
        rm -f "$RUNNER_TEMP/font_awesome_flutter.tar.gz"

        # Fail loudly if the archive was malformed, before bootstrap runs.
        test -f third_party/font_awesome_flutter/pubspec.yaml
        echo "Restored third_party/font_awesome_flutter."
