name: sanad_provider
description: Sanad provider-facing mobile application.
version: 1.0.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  app_assets:
    path: ../../packages/app_assets
  app_logger:
    path: ../../packages/app_logger
  asset_picker:
    path: ../../packages/asset_picker
  account_settings:
    path: ../../packages/account_settings
  auth:
    path: ../../packages/auth
  bottom_nav_bar:
    path: ../../packages/bottom_nav_bar
  branches:
    path: ./packages/branches
  contact_verification:
    path: ../../packages/contact_verification
  document_flow:
    path: ../../packages/document_flow
  media:
    path: ../../packages/media
  media_upload:
    path: ../../packages/media_upload
  otp:
    path: ../../packages/otp
  provider_rbac:
    path: ./packages/provider_rbac
  services:
    path: ./packages/services
  sheet_navigation:
    path: ../../packages/sheet_navigation
  workers:
    path: ./packages/workers
  core:
    path: ../../packages/core
  cupertino_icons: ^1.0.8
  deep_linking:
    path: ../../packages/deep_linking
  firebase_core: ^3.13.1
  design_system:
    path: ../../packages/design_system
  shared_ui:
    path: ../../packages/shared_ui
  dio: ^5.10.0
  easy_localization: ^3.0.8
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_hooks: ^0.21.3+1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.0.9
  fpdart: ^1.2.0
  go_router: ^17.3.0
  hidable: ^1.0.6
  hive_ce: ^2.10.1
  hydrated_bloc: ^11.0.0
  localization:
    path: ../../packages/localization
  maps:
    path: ../../packages/maps
  network:
    path: ../../packages/network
  path_provider: ^2.1.5
  permissions:
    path: ../../packages/permissions
  provider: ^6.1.5
  storage:
    path: ../../packages/storage

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  testing:
    path: ../../packages/testing
  very_good_analysis: ^9.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icons/app_icon.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash/splash_logo.png
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/branches/
    - assets/images/workers/
    - assets/images/splash/