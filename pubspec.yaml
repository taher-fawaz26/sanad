name: sanad
description: Sanad monorepo workspace root — not a publishable package.
publish_to: none

environment:
  sdk: ">=3.11.0 <4.0.0"

workspace:
  - apps/sanad_client
  - apps/sanad_provider
  - apps/design_catalog
  - packages/analytics
  - packages/api
  - packages/app_assets
  - packages/app_logger
  - packages/auth
  - packages/change_password
  - packages/config
  - packages/core
  - packages/design_system
  - packages/domain
  - packages/flavors
  - packages/forgot_password
  - packages/localization
  - packages/network
  - packages/notifications
  - packages/otp
  - packages/shared_blocs
  - packages/shared_models
  - packages/storage
  - packages/testing
  - packages/utilities

dev_dependencies:
  melos: ^7.0.0

# This is the workspace root. All real packages live under apps/ and packages/.
# Do not add dependencies here — add them to the individual package pubspecs.
