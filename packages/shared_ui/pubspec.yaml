name: shared_ui
description: Shared UI — reusable application-level widgets composed from the design system (pages, slivers, headers, sections, states, effects).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  app_animations:
    path: ../app_animations
  app_assets:
    path: ../app_assets
  core:
    path: ../core
  design_system:
    path: ../design_system
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  infinite_scroll_pagination: ^5.1.1
  localization:
    path: ../localization
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_screenutil: ^5.9.3
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/src/widgets/enhance_with_ai.svg
