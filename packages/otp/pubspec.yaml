name: otp
description: >
  Reusable OTP verification flow — a generic, transport-agnostic
  verification screen any feature can invoke via `OtpFlow.start`. Owns zero
  network endpoints; callers inject an `OtpVerifier`.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  app_animations:
    path: ../app_animations
  app_assets:
    path: ../app_assets
  bloc_concurrency: ^0.3.0
  core:
    path: ../core
  design_system:
    path: ../design_system
  easy_localization: ^3.0.8
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  fpdart: ^1.2.0
  go_router: ^17.3.0
  localization:
    path: ../localization
  sheet_navigation:
    path: ../sheet_navigation

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_screenutil: ^5.9.3
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0
