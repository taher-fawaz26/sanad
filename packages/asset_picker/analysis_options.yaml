include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gen.dart"
    - "**/generated/**"
    - "**/gen/**"
    - "build/**"

linter:
  rules:
    public_member_api_docs: false
    prefer_single_quotes: true
    always_use_package_imports: true
    # This package is intentionally interface-heavy: single-method provider and
    # validator contracts exist for dependency inversion / DI, not as a stand-in
    # for a function typedef. Keep them as abstract classes.
    one_member_abstracts: false
