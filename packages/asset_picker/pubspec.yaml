name: asset_picker
description: >-
  Sanad Asset Picker — the single source of truth for acquiring external
  assets (camera, gallery, files, document scans) behind plugin-agnostic
  interfaces. Knows nothing about any business feature.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  app_assets:
    path: ../app_assets
  core:
    path: ../core
  design_system:
    path: ../design_system
  document_camera_frame: ^2.6.9
  equatable: ^2.0.7
  # NOTE: file_picker <12 pins win32 ^5, which conflicts with the win32 ^6
  # the existing workspace already requires (geolocator → package_info_plus).
  # The 12.x line is the first to support win32 ^6, so we track it here.
  file_picker: ">=12.0.0-beta.1 <13.0.0"
  flutter:
    sdk: flutter
  go_router: ^17.3.0
  image_picker: ^1.1.2
  sheet_navigation:
    path: ../sheet_navigation

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  testing:
    path: ../testing
  very_good_analysis: ^9.0.0
