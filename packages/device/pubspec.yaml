name: device
description: >
  Device platform gateway — the single place that talks to device-capability
  plugins (device info, app info, connectivity, biometrics, clipboard, share,
  url launcher). No feature may import these plugins directly.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  connectivity_plus: ^7.2.0
  core:
    path: ../core
  # device_info_plus <13 pins win32 ^5; 13.x is the first line on win32 ^6,
  # matching the workspace-wide win32 ^6 requirement.
  device_info_plus: ">=13.0.0 <15.0.0"
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  go_router: ^17.3.0
  local_auth: ^2.3.0
  package_info_plus: ^10.2.0
  # share_plus <13 pins win32 ^5, which conflicts with the win32 ^6 the
  # workspace already requires (geolocator → package_info_plus). 13.x is the
  # first line to support win32 ^6, so we track it here.
  share_plus: ">=13.0.0 <14.0.0"
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  get_it: ^8.0.3
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0
