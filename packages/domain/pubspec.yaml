name: domain
description: >
  Shared business domain — entities, repository contracts, value objects, enums,
  and aggregates that are used across multiple features and both applications.
  No Flutter dependency, no infrastructure, no implementation details.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  core:
    path: ../core
  equatable: ^2.1.0
  fpdart: ^1.2.0
  meta: ^1.16.0

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^9.0.0
