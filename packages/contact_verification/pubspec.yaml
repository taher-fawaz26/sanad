name: contact_verification
description: >-
  Shared contact-verification flow — the unified OTP-based
  request/resend/verify contract that backs both business contact changes
  (organization_settings) and owner contact changes (account_settings).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  core:
    path: ../core
  design_system:
    path: ../design_system
  easy_localization: ^3.0.8
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  fpdart: ^1.2.0
  go_router: ^17.3.0
  network:
    path: ../network
  otp:
    path: ../otp
  shared_ui:
    path: ../shared_ui
  sheet_navigation:
    path: ../sheet_navigation

dev_dependencies:
  flutter_screenutil: ^5.9.3
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0
