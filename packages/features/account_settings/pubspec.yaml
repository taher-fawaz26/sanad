name: account_settings
description: >
  Shared account settings hub (logout today; profile/security/etc. later).
  Consumed by sanad_provider and sanad_client.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  app_assets:
    path: ../../app_assets
  auth:
    path: ../auth
  contact_verification:
    path: ../contact_verification
  core:
    path: ../../core
  design_system:
    path: ../../design_system
  easy_localization: ^3.0.8
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  fpdart: ^1.2.0
  go_router: ^17.3.0
  localization:
    path: ../../localization
  network:
    path: ../../network
  otp:
    path: ../otp
  shared_ui:
    path: ../../shared_ui
  sheet_navigation:
    path: ../../sheet_navigation

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0
