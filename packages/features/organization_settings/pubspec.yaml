name: organization_settings
description: >
  Provider-only organization settings — KPI hub, settings menu sheet, and
  general-settings placeholder. Registered only in sanad_provider.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  account_settings:
    path: ../account_settings
  app_assets:
    path: ../../app_assets
  branches:
    path: ../branches
  core:
    path: ../../core
  design_system:
    path: ../../design_system
  dio: ^5.8.0+1
  easy_localization: ^3.0.8
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  fpdart: ^1.2.0
  go_router: ^17.3.0
  media:
    path: ../../media
  network:
    path: ../../network
  workers:
    path: ../workers

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0
