name: auth
description: >
  Authentication — login, logout, OTP, token refresh, session, auth BLoC,
  auth status notifier, presentation pages, and routing.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  core:
    path: ../../core
  design_system:
    path: ../../design_system
  easy_localization: ^3.0.8
  equatable: ^2.1.0
  firebase_auth: ^5.5.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_hooks: ^0.21.3+1
  flutter_svg: ^2.0.9
  fpdart: ^1.2.0
  go_router: ^17.3.0
  google_sign_in: ^6.2.1
  hive_ce: ^2.19.3
  localization:
    path: ../../localization
  network:
    path: ../../network
  storage:
    path: ../../storage

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0
