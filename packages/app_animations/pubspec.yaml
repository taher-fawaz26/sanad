name: app_animations
description: >
  Centralized animation design system — motion tokens, reusable effects and
  patterns, page transitions, and the single Lottie abstraction. The only
  package in the workspace allowed to declare flutter_animate, animations,
  or lottie (see dep_rules.yaml).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  animations: ^2.0.11
  app_assets:
    path: ../app_assets
  core:
    path: ../core
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  lottie: ^3.3.3

dev_dependencies:
  flutter_screenutil: ^5.9.3
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
