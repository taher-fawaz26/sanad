  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  flutter_test:
    sdk: flutter
  fpdart: ^1.2.0
  mocktail: ^1.0.4
  network:
    path: ../network

dev_dependencies:
  very_good_analysis: ^9.0.0
