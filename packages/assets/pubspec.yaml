name: assets
description: >
  Asset registry — fonts, icons, images, animations, lottie files,
  and illustrations for the Sand design system.
publish_to: none
resolution: workspace
version: 0.1.0

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/lottie/
    - assets/illustrations/
