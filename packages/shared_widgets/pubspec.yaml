name: shared_widgets
description: >
  Reusable app widgets shared across features — OTP field, loading/error
  views, and other composites built on design_system.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  core:
    path: ../core
  design_system:
    path: ../design_system
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.0
  pinput: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0
