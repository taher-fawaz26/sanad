name: localization
description: Localization — EasyLocalization setup, TranslateBloc, locale resolver, validation message keys.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  core:
    path: ../core
  easy_localization: ^3.0.8
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  intl: ^0.20.2
  # Only for the one-time migration off EasyLocalization's own locale storage
  # (see LegacyLocalePreference). Already a transitive dependency of
  # easy_localization, so this adds no new native dependency.
  shared_preferences: ^2.5.3

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0

flutter:
  assets:
    - assets/translations/
