name: localization
description: Localization — EasyLocalization setup, TranslateBloc, locale resolver, validation message keys.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  core:
    path: ../core
  easy_localization: ^3.0.8
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

flutter:
  assets:
    - assets/translations/
