name: design_system
description: Design system — theme, colors, typography, tokens, and all reusable UI components.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  app_assets:
    path: ../app_assets
  cached_network_image: ^3.4.1
  core:
    path: ../core
  cupertino_icons: ^1.0.8
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  flutter_slidable: ^4.0.3
  flutter_svg: ^2.2.0
  font_awesome_flutter: ^11.0.0
  hydrated_bloc: ^11.0.0
  pinput: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  # Fonts are declared here so every consumer gets them via package dependency.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
