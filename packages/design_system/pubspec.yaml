name: design_system
description: Design system — theme, colors, typography, tokens, and all reusable UI components.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  core:
    path: ../core
  cupertino_icons: ^1.0.8
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.0
  font_awesome_flutter: ^11.0.0
  hydrated_bloc: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  # Core SVG assets (files live in packages/core/assets/svgs/).
  assets:
    - packages/core/assets/svgs/zap.svg
    - packages/core/assets/svgs/alert_circle.svg
    - packages/core/assets/svgs/alert_triangle.svg
    - packages/core/assets/svgs/check_circle.svg
  # Fonts are declared here so every consumer gets them via package dependency.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
