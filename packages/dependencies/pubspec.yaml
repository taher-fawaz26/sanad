name: dependencies
description: >
  Centralized dependency hub — re-exports every third-party package used across
  the Sanad monorepo. Import sand_dependencies instead of direct third-party
  imports so version constraints are managed in one place.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  connectivity_plus: ^7.2.0
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  easy_localization: ^3.0.8
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.3.1
  font_awesome_flutter: ^11.0.0
  fpdart: ^1.2.0
  get_it: ^8.0.3
  go_router: ^17.3.0
  hive_ce: ^2.19.3
  hydrated_bloc: ^11.0.0
  intl: ^0.20.2
  logger: ^2.6.0
  meta: ^1.16.0
  path_provider: ^2.1.5
  phone_numbers_parser: ^9.0.24
  provider: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0
