# Machine-readable architecture rules for melos validate:deps and validate:imports.
# See docs/ARCHITECTURE.md and docs/adr/ for rationale.

forbidden_edges:
  - from: core
    to: app_assets
    reason: core must remain a pure foundation package with zero asset knowledge
  - from: core
    to: design_system
    reason: core must not depend on UI packages
  - from: app_assets
    to: design_system
    reason: app_assets is a leaf asset package
  - from: design_system
    to: [auth, otp, contact_verification, media_upload, document_flow, account_settings, branches, workers, services, provider_rbac]
    reason: design_system must not depend on feature packages
  - from: design_system
    to: shared_ui
    reason: design_system is a pure UI foundation and must never depend on the application-UI layer built on top of it
  - from: shared_ui
    to: [auth, otp, contact_verification, media_upload, document_flow, account_settings, branches, workers, services, provider_rbac]
    reason: shared_ui must remain feature-independent
  - from: authorization
    to: [design_system, shared_ui, auth, account_settings, provider_rbac, branches, workers, services]
    reason: >-
      authorization is a pure evaluation/gating leaf — it must never depend on
      the packages that implement its port (auth) or consume its public API
      (features), or that would create a cycle
  - from: design_system
    to: authorization
    reason: design_system is a pure UI foundation and must not depend on the authorization leaf built on top of it
  - from: app_animations
    to: [design_system, shared_ui]
    reason: >-
      app_animations is a tier-0 foundation (design_system itself depends on
      it to migrate AppLoadingIndicator) — depending back on either would
      create a cycle
  - from: "*"
    to: [apps/sanad_client, apps/sanad_provider, apps/design_catalog]
    reason: packages must never depend on apps (app-local packages under apps/*/packages/ are fine — only the app roots themselves are forbidden)

deleted_packages:
  - shared_widgets
  - dependencies
  - settings
  # Removed as part of Phase 2 orphan cleanup — no runtime consumers.
  - api
  - shared_models
  - shared_blocs
  - domain

# Tier order — anything in tier N may only depend on packages in tier <= N.
# --strict mode (see tools/bin/validate_deps.dart) requires every workspace
# package to appear here; adding a new feature without a tier is a build error.
layer_order:
  # ai_ui_protocol is tier 0 because it depends on nothing: it is pure Dart
  # data + validation for AI-generated UI, with no Flutter dependency at all.
  # That is what makes "an AI payload is inert until a renderer acts on it" a
  # structural property rather than a policy — see packages/ai_ui_protocol.
  - tier: 0
    packages: [core, app_assets, app_animations, config, utilities, ai_ui_protocol]
  - tier: 1
    packages: [design_system, app_logger, localization, shared_ui, bottom_nav_bar, authorization]
  - tier: 2
    packages:
      - network
      - storage
      - analytics
      - notifications
      - flavors
      - testing
      - permissions
      - device
      - deep_linking
      - test_verify
      - sheet_navigation
  - tier: 3
    packages: [maps, asset_picker, otp, text_optimization, ai_ui_renderer]
  - tier: 4
    packages:
      [auth, services, workers, document_flow, contact_verification, media_upload, media, activity_logs]
  - tier: 5
    packages: [account_settings, provider_rbac, document_validation]
  - tier: 6
    packages: [branches]
  # invitation, registration, and organization_settings are no longer separate
  # workspace packages — they were folded into apps/sanad_provider/lib/src/features/
  # as plain app features (zero package-level dependents; app-local packages are
  # reserved for provider-only features that OTHER packages still import).
  - tier: 7
    packages: [sanad_client, sanad_provider, design_catalog]

# Within-package layer import rules (enforced by scan_imports.dart)
layer_rules:
  domain:
    forbidden_import_patterns:
      - "/data/"
      - "/presentation/"
      - "package:dio/"
      - "package:flutter/"
  data:
    forbidden_import_patterns:
      - "/presentation/"

# Public API barrel rules
disallow_barrel_export:
  patterns:
    - "**/*_impl.dart"
    - "**/internal/**"
  exceptions:
    - "lib/src/di/**"
    - "lib/src/module/**"
    - "lib/src/data/models/adapter/**"

# Packages allowed to import Dio directly
dio_allowed_packages:
  - network
  - sanad_client
  - sanad_provider

# Packages allowed to import infinite_scroll_pagination directly — it must
# stay a presentation-only adapter (see shared_ui/lib/src/pagination/),
# never a domain/data pagination abstraction.
infinite_scroll_pagination_allowed_packages:
  - shared_ui

# Packages allowed to import lottie/flutter_animate/animations directly —
# app_animations is the single animation-dependency boundary; every other
# package consumes motion through its API (AppLottie, AppEffects,
# AppPageTransitions, ...) instead. See packages/app_animations/README.md.
lottie_allowed_packages:
  - app_animations

flutter_animate_allowed_packages:
  - app_animations

animations_allowed_packages:
  - app_animations
